<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Typewriter Lyrics Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Typewriter Lyrics Player</h1>

    <div class="input-section">
      <label class="field">
        <span>Fandom Lyrics URL:</span>
        <input id="lyricsUrl" type="text"
               value="https://lyrics.fandom.com/wiki/Lucki:Goku">
      </label>

      <label class="field">
        <span>Song Duration (seconds):</span>
        <input id="duration" type="number" min="5" value="140">
      </label>

      <button id="startBtn">Load & Start</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>

    <div class="progress-section">
      <div class="progress-bar">
        <div id="progressFill"></div>
      </div>
      <div class="progress-info">
        <span id="timeInfo">0.0 / 0.0 s</span>
        <span id="percentInfo">0%</span>
      </div>
    </div>

    <div class="lyrics-display">
      <pre id="lyricsOutput"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
