<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<meta
name="theme-color"
content="#06070b"

>

  <title>EchoType</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <!-- BACKGROUND -->

  <div class="background" aria-hidden="true">

```
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>
<div class="glow glow-c"></div>

<div class="stars"></div>

<div class="grid"></div>
```

  </div>

  <!-- APP -->

  <main class="app">

```
<!-- TOP BAR -->

<header class="topbar">

  <div class="brand">

    <div class="logo">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div>

      <div class="brand-name">
        EchoType
      </div>

      <div class="brand-tagline">
        Lyrics in motion
      </div>

    </div>

  </div>


  <div class="ready-state">

    <span
      id="statusDot"
      class="status-dot"
    ></span>

    <span id="statusText">
      Ready
    </span>

  </div>

</header>


<!-- MAIN CONTENT -->

<div class="layout">


  <!-- LEFT -->

  <section class="player glass">


    <div class="section-label">
      PLAYER
    </div>


    <!-- COVER -->

    <div
      class="cover-stage"
      id="coverStage"
    >

      <div class="cover-shadow"></div>

      <div
        class="cover-card"
        id="coverCard"
      >

        <div
          id="placeholderCover"
          class="placeholder-cover"
        >

          <div class="placeholder-e">
            E
          </div>

          <div class="equalizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

          </div>

        </div>


        <img
          id="coverImage"
          class="cover-image hidden"
          alt="Album artwork"
        >

        <div class="cover-shine"></div>

      </div>


      <div class="ring ring-a"></div>
      <div class="ring ring-b"></div>
      <div class="ring ring-c"></div>

    </div>


    <!-- TRACK -->

    <div class="track">

      <div
        id="artistDisplay"
        class="track-artist"
      >
        Unknown Artist
      </div>

      <h1 id="titleDisplay">
        Choose a song
      </h1>

      <p id="albumDisplay">
        Enter an artist and song below.
      </p>

    </div>


    <!-- PROGRESS -->

    <div class="timeline">

      <input
        id="seekBar"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Song progress"
      >

      <div class="time-row">

        <span id="currentTime">
          0:00
        </span>

        <span id="totalTime">
          0:00
        </span>

      </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

      <button
        id="restartBtn"
        class="circle-btn"
        type="button"
        title="Restart"
        aria-label="Restart song"
      >
        ↺
      </button>

      <button
        id="playBtn"
        class="play-btn"
        type="button"
        title="Play"
        aria-label="Play"
      >
        <span id="playIcon">
          ▶
        </span>
      </button>

      <button
        id="muteBtn"
        class="circle-btn"
        type="button"
        title="Mute"
        aria-label="Mute"
      >
        ◖)
      </button>

    </div>


    <!-- VOLUME -->

    <div class="volume">

      <span>
        VOL
      </span>

      <input
        id="volumeBar"
        type="range"
        min="0"
        max="1"
        value="0.85"
        step="0.01"
        aria-label="Volume"
      >

    </div>


    <!-- AUDIO SOURCE -->

    <div class="source">

      <div class="source-top">

        <div>

          <strong>
            Find a song
          </strong>

          <small>
            Artist + title
          </small>

        </div>

        <span class="badge">
          MUSIC
        </span>

      </div>


      <label>
        <span>Artist</span>

        <input
          id="artistInput"
          type="text"
          placeholder="e.g. Lucki"
          autocomplete="off"
        >

      </label>


      <label>
        <span>Song</span>

        <input
          id="songInput"
          type="text"
          placeholder="e.g. Goku"
          autocomplete="off"
        >

      </label>


      <label>
        <span>Audio URL</span>

        <input
          id="audioInput"
          type="url"
          placeholder="Optional direct audio URL"
          autocomplete="off"
        >

      </label>


      <button
        id="loadBtn"
        class="load-btn"
        type="button"
      >

        <span>
          Load Song
        </span>

        <b>
          →
        </b>

      </button>

    </div>

  </section>


  <!-- RIGHT -->

  <section class="lyrics glass">


    <div class="lyrics-top">

      <div>

        <div class="section-label">
          LIVE LYRICS
        </div>

        <h2>
          Typewriter
        </h2>

      </div>


      <div
        id="lyricsStatus"
        class="lyrics-status"
      >
        STANDBY
      </div>

    </div>


    <div class="lyrics-window">

      <div class="lyrics-light"></div>

      <div
        id="lyricsOutput"
        class="lyrics-output"
      >

        <div class="lyrics-empty">

          <div class="empty-icon">
            ♪
          </div>

          <strong>
            Nothing playing
          </strong>

          <span>
            Choose a song to begin.
          </span>

        </div>

      </div>

      <div class="text-cursor"></div>

    </div>


    <div class="lyrics-footer">

      <div class="sync-label">

        <span id="percentInfo">
          0%
        </span>

        <span>
          playback sync
        </span>

      </div>


      <div class="progress-track">

        <div
          id="progressFill"
          class="progress-fill"
        ></div>

      </div>

    </div>

  </section>

</div>


<!-- FOOTER -->

<footer>

  <span>
    EchoType
  </span>

  <span>
    •
  </span>

  <span id="footerStatus">
    No song loaded
  </span>

</footer>
```

  </main>

  <script src="script.js"></script>

</body>

</html>
